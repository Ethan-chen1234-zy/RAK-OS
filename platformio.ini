; ==============================================================
; RAKOS - ESP32-S3 launcher OS (Waveshare 1.8" 368x448 AMOLED)
; ==============================================================
[platformio]
; Default build env: local espressif32 + app-grid UI (do not use rakos_os online platform here).
default_envs = rakos_os_appui

; ---------- shared ----------
[env]
board = esp32-s3-devkitc1-n16r8
; ESP32-S3 ROM loader must boot in DIO; 2nd-stage bootloader switches to QIO/OPI.
board_build.flash_mode = dio
board_build.partitions = partitions_rakos.csv
board_upload.flash_size = 16MB
framework = arduino
lib_compat_mode = off
lib_ldf_mode = chain
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = time
upload_protocol = custom
upload_port = auto
monitor_port = auto
upload_speed = 460800

build_flags =
  -I src
  -I lib/rakos_bsp/vendor/es8311
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_USE_DRAW_SW_ASM=LV_DRAW_SW_ASM_NONE
  -DLV_USE_NATIVE_HELIUM_ASM=0
  -DXPOWERS_CHIP_AXP2101
  -Wno-deprecated-declarations

lib_deps =
  adafruit/Adafruit BusIO @ ^1.15.0
  symlink://D:/Git_code/ESP32-S3-Touch-AMOLED-1.8/examples/Arduino-v3.3.5/libraries/Arduino_DriveBus
  https://github.com/moononournation/Arduino_GFX.git
  lvgl/lvgl @ ^9.0.0
  lewisxhe/XPowersLib @ ^0.2.9
  https://github.com/lewisxhe/SensorLib.git

extra_scripts = pre:extra_scripts/auto_port.py, pre:extra_scripts/exclude_lvgl_arm_asm.py, pre:extra_scripts/patch_shared_i2c.py, pre:extra_scripts/rename_bin.py

; ---------- OS firmware -> ota_0 @ 0x20000 ----------
[env:rakos_os]
extends = env
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.sdkconfig_defaults = sdkconfig.defaults
custom_prog_name = RAKOS
upload_command = esptool --chip esp32s3 --port ${UPLOAD_PORT} --baud ${UPLOAD_SPEED} write-flash --erase-all --flash-freq 80m --flash-mode dio --flash-size 16MB 0x0 ${BUILD_DIR}/${PROGNAME}.factory.bin

[env:rakos_os_local]
extends = env
platform = espressif32 @ 55.3.39
board_build.sdkconfig_defaults = sdkconfig.defaults
custom_prog_name = RAKOS
upload_command = esptool --chip esp32s3 --port ${UPLOAD_PORT} --baud ${UPLOAD_SPEED} write-flash --erase-all --flash-freq 80m --flash-mode dio --flash-size 16MB 0x0 ${BUILD_DIR}/${PROGNAME}.factory.bin

; ---------- App-grid launcher UI (phone-style icons) ----------
[env:rakos_os_appui]
extends = env:rakos_os_local
custom_prog_name = RAKOS-AppUI
build_flags =
  ${env:rakos_os_local.build_flags}
  -D RAKOS_UI_APP_GRID=1

; ---------- ESP32-S3-DevKitC-1 N16R8 + PY206-W38-V2 AMOLED ----------
[env:rakos_os_py206]
extends = env:rakos_os_local
custom_prog_name = RAKOS-PY206
build_flags =
  ${env:rakos_os_local.build_flags}
  -D RAKOS_BOARD_PY206_W38_V2=1
  -D RAKOS_UI_APP_GRID=1

; Demo: examples/HelloApp — build with: pio run -e hello_app
[env:hello_app]
extends = env:rakos_os_local
custom_prog_name = Hello
board_build.partitions = examples/HelloApp/partitions_app.csv
build_src_filter =
  -<main.cpp>
  -<rtos_app.cpp>
  -<ui/>
  -<fonts/>
  +<../examples/HelloApp/src/>
lib_ignore = rakos_apps
build_flags =
  -I examples/HelloApp/src
  -I lib/rakos_bsp/vendor/es8311
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_USE_DRAW_SW_ASM=LV_DRAW_SW_ASM_NONE
  -DLV_USE_NATIVE_HELIUM_ASM=0
  -DXPOWERS_CHIP_AXP2101
  -Wno-deprecated-declarations
  -include examples/HelloApp/src/lv_conf.h
extra_scripts =
  pre:extra_scripts/auto_port.py
  pre:extra_scripts/exclude_lvgl_arm_asm.py
  pre:extra_scripts/patch_shared_i2c.py
  post:examples/HelloApp/extra_scripts/copy_app_bin.py
upload_command = esptool --chip esp32s3 --port ${UPLOAD_PORT} --baud ${UPLOAD_SPEED} write-flash --flash-freq 80m --flash-mode dio --flash-size 16MB 0x400000 ${BUILD_DIR}/${PROGNAME}.bin

