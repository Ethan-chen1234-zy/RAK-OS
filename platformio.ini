custom_prog_name = RAKOS-LCD5
board_build.sdkconfig_defaults = sdkconfig.defaults,sdkconfig.defaults_lcd5
build_src_filter =
  +<*>
  -<fonts>
lib_ignore =
  Arduino_DriveBus
  Arduino_GFX
  XPowersLib
  SensorLib
lib_deps =
  symlink://D:/Downloads/ESP32-S3-Touch-LCD-5-Demo/ESP32-S3-Touch-LCD-5-Demo/Arduino/libraries/ESP32_Display_Panel
  symlink://D:/Downloads/ESP32-S3-Touch-LCD-5-Demo/ESP32-S3-Touch-LCD-5-Demo/Arduino/libraries/ESP32_IO_Expander
  symlink://D:/Downloads/ESP32-S3-Touch-LCD-5-Demo/ESP32-S3-Touch-LCD-5-Demo/Arduino/libraries/esp-lib-utils
  symlink://D:/Downloads/ESP32-S3-Touch-LCD-5-Demo/ESP32-S3-Touch-LCD-5-Demo/Arduino/libraries/lvgl
build_flags =
  -I src
  -I lib/rakos_bsp/lcd5
  -I lib/rakos_bsp/vendor/es8311
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_USE_DRAW_SW_ASM=LV_DRAW_SW_ASM_NONE
  -DLV_USE_NATIVE_HELIUM_ASM=0
  -Wno-deprecated-declarations
  -D RAKOS_BOARD_WAVESHARE_LCD5=1
  -D RAKOS_LVGL8=1
extra_scripts =
  pre:extra_scripts/auto_port.py
  pre:extra_scripts/exclude_lvgl_arm_asm.py
  pre:extra_scripts/patch_lcd5_i2c_sdkconfig.py
  pre:extra_scripts/patch_lcd5_sd_cs.py
  pre:extra_scripts/patch_shared_i2c.py
  post:extra_scripts/patch_lcd5_i2c_conflict_elf.py
  pre:extra_scripts/rename_bin.py

